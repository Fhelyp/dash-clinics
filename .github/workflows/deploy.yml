name: Deploy to Cloudflare

# Pipeline de produção do dash-clinics (frontend).
# push no `main`  ->  deploy automático do Pages (Direct Upload via wrangler-action).
# NUNCA fazer `wrangler pages deploy` de clone local: tudo passa pelo git -> main.
# Homologação: ver workflow deploy-homolog.yml (branch `homolog` -> preview URL).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Pages (frontend dashboard) ──────────────────────────────
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Pages (dash-clinics)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: de356bf3b5b6db75835e33e84876eefb
          command: pages deploy public --project-name=dash-clinics --branch=main --commit-dirty=true

# ─────────────────────────────────────────────────────────────────────────────
